modLoader = "javafml"
# javafml language-provider version (4 on NeoForge 1.21.x) — NOT the neoforge version
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/Layers-of-Railways/Railway/issues"
license = "LGPL v3"

[[mods]]
modId = "railways"
version = "${version}"
displayName = "Create: Steam 'n' Rails"
authors = "The Railways Team"
description = '''Customization and extension of Create rail systems and steam system'''

# Loaded from the default path anyway, but declared explicitly so a build that drops
# the file fails loudly instead of turning every widened member into a runtime
# IllegalAccessError. Generated from common/src/main/resources/railways.accesswidener -
# NeoForge does not read accesswidener files, only access transformers.
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[mixins]]
config = "railways.mixins.json"

[[mixins]]
config = "railways-common.mixins.json"

[[dependencies.railways]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.railways]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.railways]]
modId = "create"
type = "required"
versionRange = "${create_neoforge_version_range}"
ordering = "NONE"
side = "BOTH"
