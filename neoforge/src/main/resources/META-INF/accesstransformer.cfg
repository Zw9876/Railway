# Access transformer for NeoForge.
#
# NeoForge does not read accesswidener files. Loom applies railways.accesswidener when it
# builds the dev Minecraft jar, so widened members compile and work in dev, and the jar even
# ships the .accesswidener - but at runtime NeoForge ignores it and every widened member is
# still private. That is a silent trap: it only surfaces as IllegalAccessError the moment the
# code path actually runs (Entity.level blew up on world entry, ConductorPossessionController).
#
# This file mirrors common/src/main/resources/railways.accesswidener line for line. Keep the
# two in sync: "accessible class/field/method X" there == "public X" here.
# AbstractMinecart.getDropItem was removed in 1.21; MinecartBlock now overrides
# getPickResult instead, which needs no widening.
